services:
  - type: web
    name: carelink-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://carelink-bay.vercel.app
      - key: APP_PUBLIC_URL
        value: https://carelink-bay.vercel.app
      - key: FIREBASE_PROJECT_ID
        value: carelink-8e494
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: AI_API_URL
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  - type: web
    name: carelink-ai
    runtime: python
    rootDir: ai
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: CLIENT_ORIGIN
        value: https://carelink-bay.vercel.app
      - key: DATABASE_URL
        sync: false
